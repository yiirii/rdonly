name: Sync tests (Firebase emulator)
on:
  push:
    paths: ['src/sync/**', 'tests/emulator/**', 'firestore.rules', 'firebase.json', 'vitest.emulator.config.ts', '.github/workflows/sync-emulator.yml', 'package-lock.json']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx -y firebase-tools@14 emulators:exec --only auth,firestore --project demo-rdonly "npx vitest run --config vitest.emulator.config.ts"
