name: Build Windows installer
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: RdOnly-installer
          path: release/RdOnly-Setup-*.exe
      - if: startsWith(github.ref, 'refs/tags/')
        run: gh release create ${{ github.ref_name }} release/RdOnly-Setup-*.exe --title "Rd Only ${{ github.ref_name }}" --notes "Laptop installer for ${{ github.ref_name }}." 
        shell: bash
        env: { GH_TOKEN: '${{ github.token }}' }
