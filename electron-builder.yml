appId: com.justin.rdonly
productName: Rd Only
copyright: Justin
directories:
  output: release
  buildResources: build
files:
  - dist-electron/**/*
  - package.json
extraMetadata:
  main: dist-electron/main.cjs
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: RdOnly-Setup-${version}.${ext}
  signAndEditExecutable: true
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  # Installing a newer version runs the old version's uninstaller first (same appId).
  deleteAppDataOnUninstall: false
  shortcutName: Rd Only
asar: true
portable:
  artifactName: RdOnly-${version}-portable.${ext}
